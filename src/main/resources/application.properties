spring.application.name=admin

# ========================================
# MySQL Database Settings
# ========================================
spring.datasource.url=jdbc:mysql://localhost:3307/admin_project_db?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=0319
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# JPA Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ========================================
# Redis Settings
# ========================================
spring.data.redis.host=localhost
spring.data.redis.port=6380

# ========================================
# JWT Settings
# ========================================
# JWT Secret Key (최소 256비트 필요 - HS256 알고리즘)
jwt.secret=your-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm-security-please-change-this-in-production

# Access Token 만료 시간: 1분 (60000ms)
jwt.access-token-validity=60000

# Refresh Token 만료 시간: 2분 (120000ms)
jwt.refresh-token-validity=120000
